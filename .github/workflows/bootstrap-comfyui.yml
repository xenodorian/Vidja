name: Bootstrap ComfyUI

on:
  push:
    branches: [main]
    paths:
      - 'Current_Work.md'
      - '.github/workflows/bootstrap-comfyui.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vidja
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone official ComfyUI
        run: |
          git clone --depth 1 https://github.com/Comfy-Org/ComfyUI.git /tmp/ComfyUI

      - name: Copy ComfyUI source
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='Current_Work.md'             /tmp/ComfyUI/ ./

      - name: Preserve project handoff file
        run: |
          test -f Current_Work.md

      - name: Commit ComfyUI source
        run: |
          git config user.name "Vidja Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ComfyUI source is already current; nothing to commit."
            exit 0
          fi
          git commit -m "Bootstrap ComfyUI source [comfy-bootstrap]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
